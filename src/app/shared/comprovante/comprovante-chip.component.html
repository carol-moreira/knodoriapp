@if (compacto()) {
  <a
    [href]="comprovante().url"
    target="_blank"
    rel="noopener"
    [title]="comprovante().nome"
    class="inline-flex max-w-full items-center gap-1 text-[11px] font-medium text-primary underline-offset-2 hover:underline"
  >
    <svg [appIcon]="icons.FileText" class="h-3 w-3 shrink-0"></svg>
    <span class="truncate">comprovante</span>
  </a>
} @else {
  <div class="flex items-center gap-2.5 rounded-2xl border border-border/60 bg-muted/30 p-2">
    <a
      [href]="comprovante().url"
      target="_blank"
      rel="noopener"
      [attr.aria-label]="'abrir ' + comprovante().nome"
      class="flex min-w-0 flex-1 items-center gap-2.5"
    >
      @if (imagem()) {
        <img
          [src]="comprovante().url"
          alt=""
          class="h-10 w-10 shrink-0 rounded-lg bg-card object-cover"
        />
      } @else {
        <span
          class="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-card text-muted-foreground"
        >
          <svg [appIcon]="icons.FileText" class="h-5 w-5"></svg>
        </span>
      }
      <span class="min-w-0 flex-1">
        <span class="block truncate text-xs font-semibold">{{ comprovante().nome }}</span>
        <span class="block text-[10px] text-muted-foreground">
          {{ tamanho() }} · <app-assinatura [por]="comprovante().por" acao="enviado por" />
        </span>
      </span>
    </a>
    <a
      [href]="comprovante().url"
      [attr.download]="comprovante().nome"
      [attr.aria-label]="'baixar ' + comprovante().nome"
      class="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-muted-foreground transition hover:bg-card hover:text-foreground"
    >
      <svg [appIcon]="icons.Download" class="h-4 w-4"></svg>
    </a>
  </div>
}
