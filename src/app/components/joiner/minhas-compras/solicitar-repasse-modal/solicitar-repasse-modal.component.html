<app-dialog
  [open]="open()"
  (openChange)="onOpenChange($event)"
  overlayClass="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm animate-in fade-in duration-150"
  contentClass="fixed left-1/2 top-1/2 z-50 w-full max-w-md -translate-x-1/2 -translate-y-1/2 cozy-card shadow-2xl animate-in zoom-in-95 fade-in duration-150"
>
  <div class="flex items-center justify-between border-b border-border/60 px-6 py-4">
    <div class="flex items-center gap-2.5">
      <div class="grid h-8 w-8 place-items-center rounded-xl bg-primary/10">
        <svg [appIcon]="icons.PackageCheck" class="h-4 w-4 text-primary"></svg>
      </div>
      <div>
        <h2 class="text-sm font-bold">Solicitar Repasse</h2>
        <p class="text-[11px] text-muted-foreground">{{ pedido()?.cegNome }}</p>
      </div>
    </div>
    <button
      type="button"
      [disabled]="sending()"
      (click)="onOpenChange(false)"
      class="rounded-lg p-1.5 text-muted-foreground transition hover:bg-muted"
    >
      <svg [appIcon]="icons.X" class="h-4 w-4"></svg>
    </button>
  </div>

  <div class="space-y-4 px-6 py-5">
    @if (pedido(); as p) {
      <div class="rounded-2xl border border-border bg-muted/40 p-4 space-y-1">
        <p class="text-xs font-semibold">{{ resumoItens() }}</p>
        <p class="text-xs text-muted-foreground">{{ brl(p.valorBrl) }} · {{ p.gomUsername }}</p>
      </div>
    }
    <p class="text-sm text-muted-foreground">
      Ao solicitar o repasse, sua GOM será notificada e entrará em contato para combinar a entrega.
    </p>
    <div class="space-y-1.5">
      <label class="text-xs font-semibold">Observação (opcional)</label>
      <textarea
        [value]="obs()"
        (input)="obs.set(val($event))"
        rows="3"
        [disabled]="sending() || sent()"
        placeholder="Ex: prefiro retirar pessoalmente, qualquer dúvida me chama…"
        [class]="INPUT_CLS + ' resize-none disabled:opacity-60'"
      ></textarea>
    </div>
    <div class="flex gap-2">
      <button
        type="button"
        [disabled]="sending()"
        (click)="onOpenChange(false)"
        class="flex-1 rounded-2xl border border-border py-2.5 text-sm font-medium text-muted-foreground transition hover:text-foreground disabled:opacity-50"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="handleConfirm()"
        [disabled]="sending() || sent()"
        class="flex flex-1 items-center justify-center gap-2 rounded-2xl bg-primary py-2.5 text-sm font-semibold text-primary-foreground transition hover:opacity-90 disabled:opacity-60"
      >
        @if (sent()) {
          <svg [appIcon]="icons.CheckCircle2" class="h-4 w-4"></svg> Solicitado!
        } @else if (sending()) {
          Enviando…
        } @else {
          <svg [appIcon]="icons.Send" class="h-4 w-4"></svg> Confirmar repasse
        }
      </button>
    </div>
  </div>
</app-dialog>
