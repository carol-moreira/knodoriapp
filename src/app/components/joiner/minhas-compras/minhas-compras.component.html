@if (ativos().length === 0) {
  <div class="cozy-card flex flex-col items-center gap-3 py-14 text-center">
    <div class="grid h-14 w-14 place-items-center rounded-2xl bg-muted text-muted-foreground">
      <svg [appIcon]="icons.Package" class="h-7 w-7"></svg>
    </div>
    <p class="max-w-xs text-sm text-muted-foreground">
      nenhum pedido em andamento. use a calculadora para simular e solicitar sua próxima compra!
    </p>
  </div>
} @else {
  <div class="space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-muted-foreground">
        em andamento ({{ ativos().length }})
      </h2>
      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="abrirRepasse(null)"
          class="flex items-center gap-1.5 rounded-pill border border-border bg-card px-3 py-1.5 text-xs font-semibold transition hover:bg-muted"
        >
          <svg [appIcon]="icons.PackageCheck" class="h-3.5 w-3.5"></svg>
          solicitar repasse
        </button>
        <span class="cozy-pill bg-primary/10 text-xs font-semibold text-primary"
          >tracking ativo</span
        >
      </div>
    </div>

    @for (pedido of ativos(); track pedido.id) {
      <app-pedido-card
        [pedido]="pedido"
        [envioEtapa]="envioEtapa(pedido.id)"
        (solicitarRepasse)="abrirRepasse(pedido)"
        (solicitarEnvio)="solicitarEnvio(pedido)"
      />
    }
  </div>

  <!-- Modais fora do container espaçado (equivalente ao portal do Radix: não ocupam o fluxo) -->
  <app-solicitar-repasse-modal
    [open]="repasseOpen()"
    [pedidos]="pedidos()"
    [pedidoInicial]="repassePedido()"
    (closed)="fecharRepasse()"
  />
}
