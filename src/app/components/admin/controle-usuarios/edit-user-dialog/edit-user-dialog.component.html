<app-dialog
  [open]="open()"
  (openChange)="onOpenChange($event)"
  [overlayClass]="overlayCls"
  [contentClass]="contentCls"
>
  <div class="mb-5 flex items-start justify-between">
    <div>
      <h2 class="text-base font-bold">Editar usuário</h2>
      <p class="text-xs text-muted-foreground mt-0.5">{{ user()?.username }}</p>
    </div>
    <button
      type="button"
      (click)="onOpenChange(false)"
      class="rounded-lg p-1.5 text-muted-foreground transition hover:bg-muted"
    >
      <svg [appIcon]="icons.X" class="h-4 w-4"></svg>
    </button>
  </div>

  <div class="space-y-4">
    <div class="space-y-1.5">
      <label class="text-xs font-semibold">Nome</label>
      <input
        [value]="nome()"
        (input)="nome.set(val($event))"
        class="w-full rounded-xl border border-border bg-muted/40 px-3 py-2.5 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
      />
    </div>
    <div class="space-y-1.5">
      <label class="text-xs font-semibold">E-mail</label>
      <input
        type="email"
        [value]="email()"
        (input)="email.set(val($event))"
        class="w-full rounded-xl border border-border bg-muted/40 px-3 py-2.5 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
      />
    </div>
  </div>

  <div class="mt-6 flex justify-end gap-2">
    <button
      type="button"
      (click)="onOpenChange(false)"
      class="rounded-xl border border-border px-4 py-2 text-sm font-medium text-muted-foreground transition hover:text-foreground"
    >
      Cancelar
    </button>
    <button
      type="button"
      (click)="handleSave()"
      [disabled]="!nome() || !email()"
      class="flex items-center gap-2 rounded-xl bg-primary px-5 py-2 text-sm font-semibold text-primary-foreground transition hover:opacity-90 disabled:opacity-50"
    >
      @if (isSaved()) {
        <svg [appIcon]="icons.CheckCircle2" class="h-4 w-4"></svg>
      }
      {{ isSaved() ? "Salvo!" : "Salvar" }}
    </button>
  </div>
</app-dialog>
