<app-dialog
  [open]="open()"
  (openChange)="onOpenChange($event)"
  contentClass="fixed left-1/2 top-1/2 z-50 w-full max-w-md -translate-x-1/2 -translate-y-1/2 cozy-card shadow-2xl animate-in zoom-in-95 fade-in duration-150 max-h-[90vh] overflow-y-auto no-scrollbar"
>
  <!-- Header -->
  <div
    class="sticky top-0 flex items-center justify-between border-b border-border/60 bg-card px-6 py-4"
  >
    <div>
      <h2 class="text-base font-bold">configurações de perfil</h2>
      <p class="text-[11px] text-muted-foreground mt-0.5">edite suas informações pessoais</p>
    </div>
    <button
      type="button"
      (click)="closed.emit()"
      class="rounded-lg p-1.5 text-muted-foreground transition hover:bg-muted"
    >
      <svg [appIcon]="icons.X" class="h-4 w-4"></svg>
    </button>
  </div>

  <div class="space-y-6 px-6 py-5">
    <!-- ── Foto de perfil ─────────────────────────────────────────── -->
    <div class="flex flex-col items-center gap-3">
      <div class="relative">
        @if (avatarPreview()?.startsWith("data:")) {
          <img
            [src]="avatarPreview()"
            alt="foto de perfil"
            class="h-20 w-20 rounded-2xl object-cover ring-2 ring-primary/20"
          />
        } @else {
          <div
            class="grid h-20 w-20 place-items-center rounded-2xl bg-primary text-xl font-bold text-primary-foreground ring-2 ring-primary/20"
          >
            {{ initials() }}
          </div>
        }
        <button
          type="button"
          (click)="avatarInput.click()"
          class="absolute -bottom-2 -right-2 grid h-7 w-7 place-items-center rounded-full border-2 border-card bg-primary text-primary-foreground shadow transition hover:opacity-90"
        >
          <svg [appIcon]="icons.Camera" class="h-3.5 w-3.5"></svg>
        </button>
        <input
          #avatarInput
          type="file"
          accept="image/*"
          class="hidden"
          (change)="handleAvatarChange($event)"
        />
      </div>
      <p class="text-xs text-muted-foreground">clique no ícone para trocar a foto</p>
    </div>

    <!-- ── Campos ─────────────────────────────────────────────────── -->
    <div class="space-y-4">
      <!-- Nome -->
      <div class="space-y-1.5">
        <label class="flex items-center gap-1.5 text-xs font-semibold">
          <svg [appIcon]="icons.User" class="h-3.5 w-3.5 text-muted-foreground"></svg>
          nome
        </label>
        <input
          type="text"
          [value]="nome()"
          (input)="nome.set(val($event))"
          placeholder="seu nome completo"
          [class]="INPUT_CLS"
        />
      </div>

      <!-- @usuario -->
      <div class="space-y-1.5">
        <label class="flex items-center gap-1.5 text-xs font-semibold">
          <svg [appIcon]="icons.AtSign" class="h-3.5 w-3.5 text-muted-foreground"></svg>
          &#64;usuário
        </label>
        <input
          type="text"
          [value]="username()"
          (input)="username.set(val($event))"
          placeholder="@seuperfil"
          [class]="INPUT_CLS"
        />
      </div>

      <!-- Telefone -->
      <div class="space-y-1.5">
        <label class="flex items-center gap-1.5 text-xs font-semibold">
          <svg [appIcon]="icons.Phone" class="h-3.5 w-3.5 text-muted-foreground"></svg>
          número de telefone
        </label>
        <input
          type="tel"
          [value]="telefone()"
          (input)="telefone.set(val($event))"
          placeholder="+55 (11) 90000-0000"
          [class]="INPUT_CLS"
        />
      </div>

      <!-- Faves -->
      <div class="space-y-1.5">
        <label class="flex items-center gap-1.5 text-xs font-semibold">
          <svg [appIcon]="icons.Heart" class="h-3.5 w-3.5 text-muted-foreground"></svg>
          faves (grupos &amp; idols)
        </label>
        <textarea
          [value]="faves()"
          (input)="faves.set(val($event))"
          placeholder="me conta, quais são seus faves? idols, grupos, artistas, etc."
          rows="3"
          [class]="INPUT_CLS + ' resize-none'"
        ></textarea>
      </div>

      <!-- Wishlist -->
      <div class="space-y-1.5">
        <label class="flex items-center gap-1.5 text-xs font-semibold">
          <svg [appIcon]="icons.Link2" class="h-3.5 w-3.5 text-muted-foreground"></svg>
          wishlist
        </label>
        <div class="space-y-2">
          <input
            type="url"
            [value]="wishlistUrl()"
            (input)="wishlistUrl.set(val($event))"
            placeholder="https://link-da-sua-wishlist.com"
            [class]="INPUT_CLS"
          />
          <button
            type="button"
            (click)="wishInput.click()"
            class="flex w-full items-center justify-center gap-2 rounded-pill border border-dashed border-border py-2 text-xs font-medium text-muted-foreground transition hover:border-primary/40 hover:text-primary"
          >
            <svg [appIcon]="icons.Upload" class="h-3.5 w-3.5"></svg>
            ou envie um arquivo
          </button>
          <input
            #wishInput
            type="file"
            accept=".pdf,.jpg,.jpeg,.png,.xlsx,.csv"
            class="hidden"
            (change)="handleWishlistFile($event)"
          />
          @if (wishlistUrl() && !wishlistUrl().startsWith("http")) {
            <p class="text-[11px] text-lime-600 flex items-center gap-1">
              <svg [appIcon]="icons.CheckCircle2" class="h-3 w-3"></svg> {{ wishlistUrl() }}
            </p>
          }
        </div>
      </div>
    </div>

    <!-- ── Aparência ──────────────────────────────────────────────── -->
    <app-aparencia-settings />

    <!-- ── Botões ─────────────────────────────────────────────────── -->
    <div class="flex gap-2">
      <button
        type="button"
        (click)="closed.emit()"
        class="flex-1 rounded-2xl border border-border py-2.5 text-sm font-medium text-muted-foreground transition hover:text-foreground"
      >
        cancelar
      </button>
      <button
        type="button"
        (click)="handleSave()"
        [disabled]="saving()"
        class="flex flex-1 items-center justify-center gap-2 rounded-2xl bg-primary py-2.5 text-sm font-semibold text-primary-foreground transition hover:opacity-90 disabled:opacity-60"
      >
        @if (saved()) {
          <svg [appIcon]="icons.CheckCircle2" class="h-4 w-4"></svg>
        }
        {{ saving() ? "salvando…" : saved() ? "salvo!" : "salvar perfil" }}
      </button>
    </div>
  </div>
</app-dialog>
