@if (conversa; as c) {
  <div class="cozy-card flex h-[calc(100dvh-11rem)] min-h-112 flex-col overflow-hidden">
    <!-- Cabeçalho -->
    <header class="flex items-center gap-3 border-b border-border/60 px-5 py-4">
      <div
        class="grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-primary text-sm font-bold text-primary-foreground"
      >
        {{ c.gomUsername.slice(1, 3).toUpperCase() }}
      </div>
      <div class="min-w-0">
        <p class="text-sm font-semibold">{{ c.gomUsername }}</p>
        <p class="text-[11px] text-muted-foreground">
          sua GOM · tire dúvidas sobre pedidos, pagamentos e caixas
        </p>
      </div>
    </header>

    <app-chat-thread
      class="min-h-0 flex-1"
      [conversaId]="c.id"
      [mensagens]="mensagens()"
      [meuId]="c.joinerId"
      [pedidos]="meusPedidos()"
      [pedidoInicial]="pedido() ?? null"
      placeholder="escreva para a GOM…"
      (enviar)="enviar($event)"
    />
  </div>
} @else {
  <div class="cozy-card p-8 text-center text-sm text-muted-foreground">
    <svg [appIcon]="icons.MessageCircle" class="mx-auto mb-2 h-6 w-6"></svg>
    as mensagens ficam disponíveis para contas de joiner.
  </div>
}
