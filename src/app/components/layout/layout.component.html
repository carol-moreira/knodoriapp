@if (isFullPage()) {
  <div class="min-h-screen bg-background">
    <router-outlet />
  </div>
} @else {
  <div class="min-h-screen bg-background text-foreground">
    <!-- Header -->
    <header class="sticky top-0 z-30 border-b border-border/60 bg-background/80 backdrop-blur-md">
      <div
        class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3 sm:gap-4 sm:px-6 sm:py-4"
      >
        <!-- Logo -->
        <a routerLink="/" class="flex shrink-0 items-center gap-2 text-lg font-bold">
          <span
            class="grid h-9 w-9 place-items-center overflow-hidden rounded-2xl bg-primary shadow-sm"
          >
            @if (!logoFailed()) {
              <img
                src="/logo.jpg"
                alt="KNODORI"
                class="h-full w-full object-contain"
                (error)="logoFailed.set(true)"
              />
            } @else {
              <svg
                [appIcon]="icons.Heart"
                class="h-5 w-5 text-primary-foreground"
                fill="currentColor"
              ></svg>
            }
          </span>
          <span class="hidden sm:inline">KNODORI</span>
        </a>

        <!-- Nav -->
        @if (nav().length > 0) {
          <nav
            class="flex items-center gap-1 overflow-x-auto no-scrollbar rounded-full bg-muted/70 p-1 silver-surface shrink"
          >
            @for (item of nav(); track item.to) {
              <a
                [routerLink]="item.to"
                [class]="
                  'flex shrink-0 items-center gap-1.5 rounded-full px-3 py-2 text-sm font-medium transition sm:px-4 ' +
                  (isActive(item)
                    ? 'bg-primary text-primary-foreground shadow'
                    : 'text-foreground/70 hover:text-foreground')
                "
              >
                <svg [appIcon]="item.icon" class="h-4 w-4"></svg>
                <span class="hidden sm:inline">{{ item.label }}</span>
              </a>
            }
          </nav>
        }

        <!-- Dropdown de perfil -->
        @if (auth.user(); as user) {
          <div class="shrink-0">
            <button
              type="button"
              class="rounded-xl outline-none ring-offset-background focus-visible:ring-2 focus-visible:ring-primary"
              [cdkMenuTriggerFor]="profileMenu"
              [cdkMenuPosition]="menuPosition"
            >
              <!-- Avatar do usuário no header -->
              @switch (avatar()?.kind) {
                @case ("image") {
                  <div class="h-8 w-8 overflow-hidden rounded-xl ring-2 ring-primary/20">
                    <img
                      [src]="user.avatarUrl"
                      [alt]="user.nome"
                      class="h-full w-full object-cover"
                    />
                  </div>
                }
                @case ("emoji") {
                  <div
                    class="grid h-8 w-8 place-items-center rounded-xl bg-primary/10 text-sm ring-2 ring-primary/20"
                  >
                    {{ avatar()?.emoji }}
                  </div>
                }
                @default {
                  <div
                    class="grid h-8 w-8 place-items-center rounded-xl bg-primary text-xs font-bold text-primary-foreground"
                  >
                    {{ avatar()?.initials }}
                  </div>
                }
              }
            </button>

            <ng-template #profileMenu>
              <div
                cdkMenu
                class="z-50 min-w-45 rounded-2xl border border-border bg-card p-1.5 shadow-xl animate-in fade-in zoom-in-95 duration-100"
              >
                <!-- Info -->
                <div class="px-3 py-2 mb-1 border-b border-border/60">
                  <p class="text-xs font-semibold truncate">{{ user.nome }}</p>
                  <p class="text-[10px] text-muted-foreground truncate">{{ user.username }}</p>
                </div>

                <div
                  cdkMenuItem
                  (cdkMenuItemTriggered)="profileOpen.set(true)"
                  class="flex cursor-pointer items-center gap-2.5 rounded-xl px-3 py-2 text-sm font-medium outline-none transition hover:bg-muted"
                >
                  <svg [appIcon]="icons.Settings" class="h-4 w-4 text-muted-foreground"></svg>
                  configurações de perfil
                </div>

                <div role="separator" class="my-1 h-px bg-border/60"></div>

                <div
                  cdkMenuItem
                  (cdkMenuItemTriggered)="handleSignOut()"
                  class="flex cursor-pointer items-center gap-2.5 rounded-xl px-3 py-2 text-sm font-medium text-destructive outline-none transition hover:bg-destructive/10"
                >
                  <svg [appIcon]="icons.LogOut" class="h-4 w-4"></svg>
                  sair
                </div>
              </div>
            </ng-template>

            <app-profile-settings-modal [open]="profileOpen()" (closed)="profileOpen.set(false)" />
          </div>
        }
      </div>
    </header>

    <!-- Conteúdo -->
    <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10">
      <router-outlet />
    </main>

    <footer class="border-t border-border/60 py-6 text-center text-xs text-muted-foreground">
      feito de colecionador para colecionador
    </footer>
  </div>
}
