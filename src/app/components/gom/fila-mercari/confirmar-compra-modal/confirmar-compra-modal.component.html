<app-dialog
  [open]="open()"
  (openChange)="onOpenChange($event)"
  contentClass="fixed left-1/2 top-1/2 z-50 w-full max-w-md -translate-x-1/2 -translate-y-1/2 cozy-card shadow-2xl animate-in zoom-in-95 fade-in duration-150 max-h-[90vh] overflow-y-auto no-scrollbar"
>
  <div class="flex items-center justify-between border-b border-border/60 px-6 py-4">
    <div>
      <h2 class="text-sm font-bold">confirmar compra</h2>
      <p class="text-[11px] text-muted-foreground">
        {{ solicitacao()?.joinerUsername }} · {{ resumo() }}
      </p>
    </div>
    <button
      type="button"
      (click)="onOpenChange(false)"
      class="rounded-lg p-1.5 text-muted-foreground transition hover:bg-muted"
    >
      <svg [appIcon]="icons.X" class="h-4 w-4"></svg>
    </button>
  </div>

  <div class="space-y-4 px-6 py-5">
    <!-- Proof -->
    <div class="space-y-1.5">
      <p class="text-xs font-semibold">proof da compra</p>
      <div class="grid grid-cols-3 gap-2">
        @for (p of proofs(); track $index) {
          <div class="group relative aspect-square overflow-hidden rounded-xl border border-border">
            <img [src]="p" [alt]="'proof ' + ($index + 1)" class="h-full w-full object-cover" />
            <button
              type="button"
              (click)="remover($index)"
              [attr.aria-label]="'remover proof ' + ($index + 1)"
              class="absolute right-1 top-1 grid h-6 w-6 place-items-center rounded-full bg-black/60 text-white opacity-0 transition group-hover:opacity-100 focus:opacity-100"
            >
              <svg [appIcon]="icons.X" class="h-3 w-3"></svg>
            </button>
          </div>
        }
        <label
          class="flex aspect-square cursor-pointer flex-col items-center justify-center gap-1 rounded-xl border border-dashed border-primary/40 text-primary transition hover:bg-primary/5"
        >
          <svg [appIcon]="icons.ImagePlus" class="h-5 w-5"></svg>
          <span class="text-[10px] font-medium">anexar</span>
          <input
            type="file"
            accept="image/*"
            multiple
            class="sr-only"
            (change)="handleFiles($event)"
          />
        </label>
      </div>
      <p class="text-[11px] text-muted-foreground">
        print da compra na proxy / mercari. a joiner é notificada da compra confirmada.
      </p>
    </div>

    <!-- Caixa -->
    <div class="space-y-1.5">
      <label for="confirmar-caixa" class="text-xs font-semibold">direcionar para a caixa</label>
      <select id="confirmar-caixa" (change)="cegId.set(val($event))" [class]="INPUT_CLS">
        @for (c of caixas(); track c.id) {
          <option [value]="c.id" [selected]="c.id === cegId()">
            {{ c.nome }} · {{ c.qtdJoiners }} joiners · {{ c.qtdItens }} itens
          </option>
        }
        <option value="NOVA" [selected]="cegId() === 'NOVA'">+ abrir {{ proximaCaixa() }}</option>
      </select>
    </div>

    @if (erro()) {
      <p class="text-xs font-medium text-destructive">{{ erro() }}</p>
    }

    <div class="flex gap-2">
      <button
        type="button"
        (click)="onOpenChange(false)"
        class="flex-1 rounded-2xl border border-border py-2.5 text-sm font-medium text-muted-foreground transition hover:text-foreground"
      >
        cancelar
      </button>
      <button
        type="button"
        (click)="handleConfirm()"
        [disabled]="proofs().length === 0"
        class="flex flex-1 items-center justify-center gap-2 rounded-2xl bg-primary py-2.5 text-sm font-semibold text-primary-foreground transition hover:opacity-90 disabled:opacity-60"
      >
        <svg [appIcon]="icons.CheckCircle2" class="h-4 w-4"></svg>
        confirmar compra
      </button>
    </div>
  </div>
</app-dialog>
